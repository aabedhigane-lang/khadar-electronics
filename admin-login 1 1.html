<!DOCTYPE html>
<html>

<head>
<title>Admin Login - Khadar Electronic</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.box{
    background:white;
    width:80%;
    margin:80px auto;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:90%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:8px;
}

</style>

</head>


<body>

<div class="box">

<h1>⚙️ Admin Login</h1>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="adminLogin()">
Login
</button>

</div>


<script>

function adminLogin(){

let username = document.getElementById("username").value;

let password = document.getElementById("password").value;


// Admin xogta tijaabada

if(username === "khadar" && password === "123"){

localStorage.setItem("adminLogin","true");

alert("Admin Login Successful ✅");

window.location.href="admin.html";

}

else{

alert("Username ama Password waa khalad ❌");

}

}

</script>


</body>
</html>
