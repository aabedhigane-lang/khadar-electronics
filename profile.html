<!DOCTYPE html>
<html>
<head>
<title>Profile - Khadar Electronic</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#0066ff;
    color:white;
    text-align:center;
    padding:20px;
}

.profile{
    background:white;
    margin:20px;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

.avatar{
    font-size:70px;
}

button{
    width:90%;
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:white;
}
</style>

</head>

<body>

<div class="header">
<h1>Khadar Electronic</h1>
</div>

<div class="profile">

<div class="avatar">
👤
</div>

<h2 id="userName">User Name</h2>

<p id="userEmail">Email</p>

<button onclick="openOrders()">
My Orders 📦
</button>

<button>Edit Profile ⚙️</button>

<button onclick="logout()">Logout 🚪</button>

</div>
<script>

let user = JSON.parse(localStorage.getItem("user"));

if(user){

document.getElementById("userName").innerHTML = user.name;

document.getElementById("userEmail").innerHTML =
"Email: " + user.email;

}


function logout(){

localStorage.removeItem("login");

alert("Logged out successfully");

window.location.href="login.html";

}

</script>
<script>

function openOrders(){

window.location.href="my-orders.html";

}
let login = localStorage.getItem("login");

if(login !== "true"){

alert("Fadlan Login samee 🔐");

window.location.href="login.html";

}
</script>
</body>
</html>
