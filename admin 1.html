<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Khadar Electronic</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#0066ff;
    color:white;
    padding:20px;
    text-align:center;
}

.box{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
}

input{
    width:90%;
    padding:12px;
    margin:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:95%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:8px;
}

.product{
    margin-top:15px;
    padding:15px;
    background:#eee;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="header">
<h1>⚙️ Admin Panel</h1>
<p>Khadar Electronic</p>
</div>


<div class="box">
<input id="pname" placeholder="Product Name">

<input id="pcategory" placeholder="Category">

<input id="pprice" placeholder="Price">
<input type="file" id="pimage" accept="image/*">
<button onclick="addProduct()">
Add Product ➕
</button>

<h2>Products List</h2>

<div id="productList"></div>
<h2>Customer Orders 📦</h2>

<div id="adminOrders"></div>
<h2>Add New Product</h2>
<input id="adminSearch" placeholder="Search Product..." onkeyup="searchAdminProduct()">

<input placeholder="Product Name">

<input placeholder="Category">

<input placeholder="Price">

<input placeholder="Image URL">


<button onclick="saveProduct()">Add Product ➕</button>


<h2>Products List</h2>

<div class="product">
📱 Samsung S24
<br>
Price: £900
</div>

<div class="product">
💻 HP EliteBook
<br>
Price: £350
</div>


</div>
<script src="database.js"></script>

<script>

function saveProduct(){

let name = document.querySelectorAll("input")[0].value;
let category = document.querySelectorAll("input")[1].value;
let price = document.querySelectorAll("input")[2].value;
let image = document.querySelectorAll("input")[3].value;

addProduct(name, category, price, image);

}

</script>
<script>

let admin = localStorage.getItem("adminLogin");

if(admin !== "true"){

alert("Ma lihid ogolaansho ⚠️");

window.location.href="admin-login.html";

}

</script>
<script>

function addProduct(){

let products = JSON.parse(localStorage.getItem("products")) || [];


let product = {
    let file = document.getElementById("pimage").files[0];

let reader = new FileReader();

reader.onload = function(){

let imageData = reader.result;

image: imageData

category: document.getElementById("pcategory").value,

price: document.getElementById("pprice").value,

image: document.getElementById("pimage").value

};


products.push(product);


localStorage.setItem(
"products",
JSON.stringify(products)
);


alert("Product Added ✅");

showProducts();

}



function showProducts(){

let products = JSON.parse(localStorage.getItem("products")) || [];

let box = document.getElementById("productList");

box.innerHTML="";


products.forEach(function(product,index){

box.innerHTML += `

<div class="product">

<h3>${product.name}</h3>

<p>${product.category}</p>

<p>£${product.price}</p>
<button onclick="editProduct(${index})">
Edit ✏️
</button>
<button onclick="deleteProduct(${index})">
Delete ❌
</button>

</div>

`;

});

}



function deleteProduct(index){

let products = JSON.parse(localStorage.getItem("products")) || [];

products.splice(index,1);

localStorage.setItem(
"products",
JSON.stringify(products)
);


showProducts();

}


showProducts();
function editProduct(index){

let products = JSON.parse(localStorage.getItem("products")) || [];

let product = products[index];


let name = prompt("Product Name", product.name);

let category = prompt("Category", product.category);

let price = prompt("Price", product.price);

let image = prompt("Image URL", product.image);


products[index] = {

name:name,

category:category,

price:price,

image:image

};


localStorage.setItem(
"products",
JSON.stringify(products)
);


alert("Product Updated ✅");

showProducts();

}
function showOrders(){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let box = document.getElementById("adminOrders");

box.innerHTML = "";


orders.forEach(function(order,index){

let items = "";


order.items.forEach(function(item){

items += `
<p>
${item.name} - £${item.price}
</p>
`;

});


box.innerHTML += `

<div class="product">

<h3>Order #${index + 1}</h3>

${items}

<p>
Date: ${order.date}
</p>


<select onchange="updateOrderStatus(${index}, this.value)">

<option ${order.status=="Pending"?"selected":""}>
🕒 Pending
</option>

<option ${order.status=="Processing"?"selected":""}>
⚙️ Processing
</option>

<option ${order.status=="Delivered"?"selected":""}>
🚚 Delivered
</option>

</select>


</div>

`;

});

}



function updateOrderStatus(index,status){

let orders = JSON.parse(localStorage.getItem("orders")) || [];


orders[index].status = status;


localStorage.setItem(
"orders",
JSON.stringify(orders)
);


alert("Order Status Updated ✅");

}



showOrders();
function searchAdminProduct(){

let input = document.getElementById("adminSearch").value.toLowerCase();

let products = document.querySelectorAll(".product");


products.forEach(function(product){

let text = product.innerText.toLowerCase();


if(text.includes(input)){

product.style.display="block";

}else{

product.style.display="none";

}

});

}
</script>
</body>
</html>""
