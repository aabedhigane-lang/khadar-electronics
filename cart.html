<!DOCTYPE html>
<html>
<head>
<title>Cart - Khadar Electronic</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#0066ff;
    color:white;
    padding:20px;
    text-align:center;
}

.cart{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:15px;
    border-bottom:1px solid #ddd;
}

button{
    background:#0066ff;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
    width:100%;
}
</style>

</head>

<body>

<div class="header">
<h1>🛒 Your Cart</h1>
<p>Khadar Electronic</p>
</div>

<div class="cart">
    <div id="cartItems"></div>

<h2 id="total"></h2>

<div class="item">
<span>📱 Samsung S24</span>
<span>$900</span>
</div>

<div class="item">
<span>🎧 AirPods</span>
<span>$120</span>
</div>

<h2>Total: $1020</h2>

<button onclick="checkout()">
Checkout 📦
</button>

</div>
<script>

function checkout(){

let cart = JSON.parse(localStorage.getItem("cart")) || [];

if(cart.length === 0){

alert("Cart-ka wuu maranyahay!");

return;

}

let orders = JSON.parse(localStorage.getItem("orders")) || [];
orders.push({

    items: cart,

    date: new Date().toLocaleString(),

    status: "Pending"

});

localStorage.setItem("orders", JSON.stringify(orders));

localStorage.removeItem("cart");

alert("Order-kaaga waa la diray ✅");
window.location.href="payment.html";

}

</script>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cartItems");

let totalBox = document.getElementById("total");

let total = 0;


cart.forEach(function(item,index){

total += Number(item.price);

box.innerHTML += `

<div class="item">

<span>
${item.name}
<br>
£${item.price}
</span>

<button onclick="removeItem(${index})">
Remove ❌
</button>

</div>

`;

});


totalBox.innerHTML = "Total: £" + total;



function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

location.reload();

}



function checkout(){
    let login = localStorage.getItem("login");

if(login !== "true"){

alert("Fadlan marka hore Login samee 🔐");

window.location.href="login.html";

return;

}

if(cart.length === 0){

alert("Cart-ka wuu madhan yahay!");

return;

}


let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({

items: cart,

date: new Date().toLocaleString(),

status:"Pending"

});


localStorage.setItem("orders",JSON.stringify(orders));

localStorage.removeItem("cart");

alert("Order-kaaga waa la diray ✅");

window.location.href="payment.html";

}

</script>
</body>
</html>
