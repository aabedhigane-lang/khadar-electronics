<!DOCTYPE html>
<html>
<head>

<title>Product Details - Khadar Electronic</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.header{
    background:#0066ff;
    color:white;
    padding:20px;
    text-align:center;
}

.product{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

img{
    width:200px;
    border-radius:10px;
}

button{
    background:#0066ff;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="header">
<h1>📱 Khadar Electronic</h1>
</div>

<div class="product">

<img id="image">

<h2 id="name"></h2>

<p id="category"></p>

<h3 id="price"></h3>

<p>
Quality electronics with warranty.
</p>

<button>Add To Cart 🛒</button>

</div>


<script>

let product = JSON.parse(localStorage.getItem("selectedProduct"));

document.getElementById("image").src = product.image;
document.getElementById("name").innerHTML = product.name;
document.getElementById("category").innerHTML = product.category;
document.getElementById("price").innerHTML = "£" + product.price;

</script>


</body>
</html>
